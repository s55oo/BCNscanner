services:
  web:
    image: nginx:alpine
    container_name: bcnscanner-web
    ports:
      - "8083:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - scanner

  scanner:
    build:
      context: ./scanner
    container_name: bcnscanner-api
    environment:
      - LISTENING_GRID=${LISTENING_GRID:-JN76JG}
      - ROTATOR_ENABLED=${ROTATOR_ENABLED:-no}
      - ROTATOR_TYPE=${ROTATOR_TYPE:-pstrotator-http}
      - ROTATOR_HOST=${ROTATOR_HOST:-10.147.17.32}
      - ROTATOR_PORT=${ROTATOR_PORT:-80}
      - ROTATOR_CMD_PORT=${ROTATOR_CMD_PORT:-12000}
      - ROTATOR_TCP_PORT=${ROTATOR_TCP_PORT:-2000}
      - RADIO_TYPE=${RADIO_TYPE:-rigctld}
      - RADIO_MODEL=${RADIO_MODEL:-}
      - RADIO_ENABLED=${RADIO_ENABLED:-no}
      - RADIO_HOST=${RADIO_HOST:-127.0.0.1}
      - RADIO_PORT=${RADIO_PORT:-4532}
      - RADIO_TUNE_MODE=${RADIO_TUNE_MODE:-CW}
      - RADIO_FREQ_OFFSET=${RADIO_FREQ_OFFSET:-0}
    restart: unless-stopped
